name: Bug report
description: 报告可复现的问题，帮助定位和修复缺陷。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供可复现的信息。涉及下载地址、代理、密钥或本地路径时，请先脱敏。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么，以及你期望发生什么。
      placeholder: 例如：下载某个 m3u8 时在合并阶段失败。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请列出稳定复现问题的步骤。
      placeholder: |
        1. 打开应用
        2. 输入链接 ...
        3. 点击下载
        4. 出现错误 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 粘贴关键日志、异常堆栈或截图。请删除敏感信息。
      render: text

  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: v0.0.2

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows x86_64
        - Linux x86_64
        - Linux arm64
        - macOS x86_64
        - macOS arm64
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 issue，确认不是重复问题。
          required: true
        - label: 我已经移除日志、链接、路径或密钥中的敏感信息。
          required: true
