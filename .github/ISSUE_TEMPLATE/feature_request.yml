name: Feature request
description: 提出功能建议或改进方向。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 说明当前遇到的问题或使用场景。
      placeholder: 例如：批量下载时希望能导入多个链接。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望软件如何表现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如果有其他实现方式，也可以写在这里。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 issue，确认不是重复建议。
          required: true
        - label: 这个需求和 M3U8 下载、解析、任务管理或桌面应用体验有关。
          required: true
